services:
  kelpgate.scanner:
    class: Drupal\kelpgate\Scanner\KelpgateScanner
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.channel.kelpgate'
      - '@cache.default'
      - '@state'

  logger.channel.kelpgate:
    parent: logger.channel_base
    arguments: ['kelpgate']

  kelpgate.file_validation_subscriber:
    class: Drupal\kelpgate\EventSubscriber\FileValidationSubscriber
    arguments: ['@kelpgate.scanner']
    tags:
      - { name: event_subscriber }
