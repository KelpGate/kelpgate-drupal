name: Release

# Push a tag such as v1.0.0 (or let auto-tag.yml push it when CHANGELOG.md gets a "## 1.0.0" entry) to publish
# a GitHub Release. Packagist, once the package is registered there, picks the tag up through its GitHub hook.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # started by auto-tag.yml with the tag as the ref

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag, changelog and PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
      - name: The changelog must have an entry for this version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / {if (found) exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Lint every PHP file
        run: find . -type f \( -name '*.php' -o -name '*.module' \) -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub Release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / {if (found) exit} found' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "kelpgate/kelpgate-drupal $GITHUB_REF_NAME" \
            --notes-file release-notes.md
